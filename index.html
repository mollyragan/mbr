// Turns a caption into safe HTML: keeps line breaks, <b>/<strong>, <i>/<em>,
// <u> and links (http, https, mailto); anything else is reduced to plain text.
function renderCaption(raw) {
  if (!raw) return '';
  const tpl = document.createElement('template');
  tpl.innerHTML = String(raw).replace(/\r\n?/g, '\n');
  const KEEP = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, A: 1, BR: 1 };
  const DROP = { SCRIPT: 1, STYLE: 1, IFRAME: 1, OBJECT: 1, EMBED: 1, TEMPLATE: 1 };
  const clean = node => {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 3) {
        const parts = child.textContent.split('\n');
        if (parts.length > 1) {
          const frag = document.createDocumentFragment();
          parts.forEach((part, i) => {
            if (i) frag.appendChild(document.createElement('br'));
            frag.appendChild(document.createTextNode(part));
          });
          child.replaceWith(frag);
        }
        return;
      }
      if (child.nodeType !== 1 || DROP[child.tagName]) { child.remove(); return; }
      clean(child);
      if (!KEEP[child.tagName]) { child.replaceWith(...child.childNodes); return; }
      let href = (child.getAttribute('href') || '').trim();
      [...child.attributes].forEach(a => child.removeAttribute(a.name));
      if (child.tagName === 'A') {
        if (/^www\./i.test(href)) href = 'https://' + href;
        if (/^(https?:|mailto:)/i.test(href)) {
          child.setAttribute('href', href);
          child.setAttribute('target', '_blank');
          child.setAttribute('rel', 'noopener');
        } else {
          child.replaceWith(...child.childNodes);
        }
      }
    });
  };
  clean(tpl.content);
  const out = document.createElement('div');
  out.appendChild(tpl.content);
  return out.innerHTML;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── PROJECTS (loaded from the `projects` table; only visible ones come back) ──
let projects     = {};
let projectOrder = [];

async function fetchProjects() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/projects?select=*&visible=eq.true&order=sort_order.asc`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const data = await res.json();
    if (!Array.isArray(data)) return;
    projects = {};
    projectOrder = [];
    data.forEach(row => {
      projects[row.key] = {
        title:     row.title,
        gallery:   row.type === 'gallery',
        link:      row.type === 'link' ? row.link : null,
        columns:   row.columns || 3,
        show_date: !!row.show_date,
        layout:    row.layout || 'grid',          // 'entries' = tools layout
        show_labels: row.show_labels !== false,
      };
      projectOrder.push(row.key);
    });
  } catch (e) {
    console.warn('Could not fetch projects:', e);
  }
}

function buildIndexItems() {
  canvas.innerHTML = '';
  projectOrder.forEach(key => {
    const item = document.createElement('div');
    item.className = 'index-item';
    item.dataset.project = key;
    item.innerHTML = `<div class="index-thumb-wrap"><img alt="${esc(projects[key].title)}"><div class="resize-handle"></div><div class="edge-n"></div><div class="edge-s"></div><div class="edge-e"></div><div class="edge-w"></div></div>`;
    canvas.appendChild(item);
  });
}

async function fetchWdysImages() {
  if (!projects.whatdoyousee) return;
  try {
    const res = await fetch(
      `${WDYS_URL}/rest/v1/images?select=url,created_at&order=created_at.desc`,
      { headers: { 'apikey': WDYS_ANON_KEY, 'Authorization': `Bearer ${WDYS_ANON_KEY}` } }
    );
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) return;

    projects.whatdoyousee.images = data.map(row => ({ url: row.url }));

    const item = document.querySelector('.index-item[data-project="whatdoyousee"]');
    if (item) {
      const img = item.querySelector('.index-thumb-wrap img');
      const firstUrl = data[0].url;
      if (img && firstUrl && !firstUrl.endsWith('.pdf')) {
        img.src = firstUrl;
      }
    }
  } catch (e) {
    console.warn('Could not fetch whatdoyousee images:', e);
  }
}

async function fetchGalleryImages() {
  try {
    const cols = 'project,url,sort_order,taken_at,location,lat,lng,plant,book,scanned,book_link,question_1,question_2,cable,type,use,contents,caption';
    const get  = select => fetch(
      `${SUPABASE_URL}/rest/v1/images?select=${select}&order=sort_order.desc`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    let res = await get(cols + ',entry_id');
    if (!res.ok) res = await get(cols);          // tools.sql not run yet
    const data = await res.json();
    if (!Array.isArray(data)) return;

    const byProject = {};
    data.forEach(row => {
      if (!byProject[row.project]) byProject[row.project] = [];
      byProject[row.project].push({
        url:       row.url,
        taken_at:  row.taken_at  || null,
        location:  row.location  || null,
        lat:       row.lat       ?? null,
        lng:       row.lng       ?? null,
        plant:     row.plant     || null,
        book:      row.book      || null,
        scanned:   row.scanned   || null,
        book_link: row.book_link || null,
        question_1:row.question_1 || null,
        question_2:row.question_2 || null,
        cable:     row.cable     || null,
        type:      row.type      || null,
        use:       row.use       || null,
        contents:  row.contents  || null,
        caption:   row.caption   || null,
        sort_order: row.sort_order ?? 0,
        entry_id:  row.entry_id  ?? null,
      });
    });

    const monthMap = { jan:0, feb:1, mar:2, apr:3, may:4, june:5, july:6, aug:7, sep:8, oct:9, nov:10, dec:11 };

    Object.keys(byProject).forEach(key => {
      if (!projects[key]) return;

      if (key === 'bioephemera') {
        byProject[key].sort((a, b) => {
          const parse = s => {
            if (!s) return null;
            const [mon, yr] = s.trim().split(' ');
            if (!mon || !yr) return null;
            return new Date(parseInt(yr), monthMap[mon] ?? 0);
          };
          const da = parse(a.scanned), db = parse(b.scanned);
          if (!da && !db) return 0;
          if (!da) return 1;
          if (!db) return -1;
          return db - da;
        });
      }
      if (key === 'trees' || key === 'cables' || key === 'selfies') {
        byProject[key].sort((a, b) => {
          if (!a.taken_at && !b.taken_at) return 0;
          if (!a.taken_at) return 1;
          if (!b.taken_at) return -1;
          return new Date(b.taken_at) - new Date(a.taken_at);
        });
      }

      projects[key].images = byProject[key];
      if (projects[key].layout === 'entries') return;   // handled by applyEntries below

      const item = document.querySelector(`.index-item[data-project="${key}"]`);
      if (item) {
        const img = item.querySelector('.index-thumb-wrap img');
        const firstUrl = byProject[key][0].url;
        if (img && firstUrl && !firstUrl.endsWith('.pdf')) {
          img.src = firstUrl;
        }
      }
    });

    await applyEntries(byProject);
  } catch (e) {
    console.warn('Could not fetch gallery images:', e);
  }
}

// ── TOOLS LAYOUT ──
// Each tool (an "entry") has several images; the first is its main image.
// The home-page slideshow and the grid use the main images only.
async function applyEntries(byProject) {
  const keys = projectOrder.filter(k => projects[k].layout === 'entries');
  if (!keys.length) return;

  let rows = [];
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/entries?select=*&visible=eq.true&project=in.(${keys.map(encodeURIComponent).join(',')})&order=sort_order.asc`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const data = await res.json();
    if (Array.isArray(data)) rows = data;
  } catch (e) {
    console.warn('Could not fetch tools:', e);
  }

  keys.forEach(key => {
    const imgs = (byProject[key] || []).filter(i => i.entry_id != null && !i.url.endsWith('.pdf'));
    const entries = rows
      .filter(e => e.project === key)
      .map(e => ({
        ...e,
        images: imgs.filter(i => i.entry_id === e.id).sort((a, b) => a.sort_order - b.sort_order),
      }))
      .filter(e => e.images.length);        // a tool needs at least one image to appear

    const p = projects[key];
    p.entries = entries;
    p.images  = entries.map(e => e.images[0]);

    const item = document.querySelector(`.index-item[data-project="${key}"]`);
    const img  = item && item.querySelector('.index-thumb-wrap img');
    if (img && p.images.length) img.src = p.images[0].url;
  });
}

function buildEntriesGrid(p) {
  p.entries.forEach((e, i) => {
    const tile = document.createElement('div');
    tile.className = 'entry-tile';
    tile.dataset.entry = i;
    tile.innerHTML = `
      <img src="${esc(e.images[0].url)}" loading="lazy" alt="">
      <div class="entry-tile-text">
        <span class="entry-tile-title">${esc(e.title)}</span>
        ${p.show_labels && e.label ? `<span class="entry-tile-label">${esc(e.label)}</span>` : ''}
      </div>`;
    galleryGrid.appendChild(tile);
  });
}

function formatEntryMeta(e, p) {
  const head = [`<div>${esc(e.title)}</div>`];
  if (p.show_labels && e.label) head.push(`<div class="entry-meta-label">${esc(e.label)}</div>`);
  let html = `<div class="entry-meta-head">${head.join('')}</div>`;
  if (e.file_url && /^(https?:|mailto:)/i.test(e.file_url)) {
    const text = e.file_path ? `download ${e.file_name || 'file'}` : 'open link';
    html += `<a class="entry-meta-file" href="${esc(e.file_url)}" target="_blank" rel="noopener">${esc(text)} ↗</a>`;
  }
  if (e.description) html += `<div class="entry-meta-desc">${renderCaption(e.description)}</div>`;
  return html;
}

// Returns true when viewport is portrait (mobile layout)
function isMob() { return window.innerWidth < window.innerHeight; }

// ── ASPECT-RATIO HELPERS (for responsive image wrapper sizing) ──
function computeWrapSize(sz, aspect) {
  if (!aspect || !isFinite(aspect) || aspect <= 0) aspect = 1;
  return aspect >= 1 ? { w: sz, h: sz / aspect } : { w: sz * aspect, h: sz };
}

function getItemAspect(item) {
  const img = item.querySelector('.index-thumb-wrap img');
  if (img && img.naturalWidth && img.naturalHeight) return img.naturalWidth / img.naturalHeight;
  return 1; // fallback before image loads
}

// Per-item layout state: { left, top, w, h, pinned }
const itemState = {};

function applyItemState(item, key, animate) {
  const s = itemState[key];
  if (!s) return;
  const wrap = item.querySelector('.index-thumb-wrap');
  if (animate) item.classList.add('layout-animating');
  item.style.left = s.left + 'px';
  item.style.top  = s.top  + 'px';
  wrap.style.width  = s.w + 'px';
  wrap.style.height = s.h + 'px';
  if (animate) setTimeout(() => item.classList.remove('layout-animating'), 520);
}

// ── LAYOUTS ──
const LAYOUTS_DESKTOP = [
  [[6.0,8.0,23.0],[52.0,5.0,19.0],[74.0,34.0,22.0],[30.0,44.0,20.0],[4.0,58.0,21.0],[58.0,62.0,23.0]],
  [[48.0,10.0,24.0],[9.0,18.0,20.0],[76.0,12.0,19.0],[26.0,52.0,23.0],[62.0,48.0,21.0],[5.0,62.0,20.0]],
  [[8.0,6.0,21.0],[38.0,22.0,24.0],[70.0,8.0,20.0],[13.0,54.0,22.0],[54.0,56.0,23.0],[78.0,52.0,19.0]],
  [[30.0,7.0,22.0],[64.0,14.0,23.0],[6.0,30.0,20.0],[44.0,46.0,21.0],[73.0,58.0,22.0],[15.0,64.0,23.0]],
  [[5.0,12.0,24.0],[42.0,6.0,20.0],[72.0,28.0,23.0],[22.0,50.0,21.0],[56.0,52.0,20.0],[80.0,66.0,19.0]],
  [[10.0,20.0,20.0],[46.0,12.0,23.0],[75.0,6.0,21.0],[8.0,58.0,23.0],[38.0,54.0,20.0],[64.0,60.0,22.0]],
];
const LAYOUTS_MOBILE = [
  [[8.0,6.0,38.0],[56.0,18.0,34.0],[12.0,38.0,36.0],[54.0,50.0,38.0],[6.0,68.0,34.0],[50.0,78.0,36.0]],
  [[50.0,8.0,38.0],[10.0,20.0,36.0],[54.0,40.0,34.0],[8.0,54.0,38.0],[52.0,68.0,36.0],[14.0,80.0,34.0]],
  [[10.0,10.0,36.0],[52.0,6.0,38.0],[14.0,42.0,34.0],[54.0,48.0,36.0],[8.0,72.0,38.0],[52.0,80.0,34.0]],
  [[12.0,14.0,38.0],[54.0,22.0,34.0],[8.0,44.0,36.0],[52.0,56.0,38.0],[16.0,74.0,34.0],[54.0,82.0,36.0]],
  [[8.0,8.0,34.0],[52.0,14.0,38.0],[12.0,40.0,38.0],[56.0,50.0,34.0],[10.0,70.0,36.0],[50.0,78.0,38.0]],
  [[14.0,12.0,36.0],[52.0,8.0,34.0],[10.0,46.0,38.0],[54.0,46.0,36.0],[8.0,74.0,34.0],[54.0,80.0,38.0]],
];
let currentLayout = 0;

// Scatter position for any project beyond the 6 hand-made slots
function randomSlot(mob) {
  return mob
    ? [6 + Math.random() * 50, 6 + Math.random() * 80, 34 + Math.random() * 4]
    : [4 + Math.random() * 72, 4 + Math.random() * 62, 19 + Math.random() * 5];
}

function randomLayout(animate) {
  const iw = window.innerWidth, ih = window.innerHeight;
  const mob = isMob();
  const layouts = mob ? LAYOUTS_MOBILE : LAYOUTS_DESKTOP;
  const layout = layouts[currentLayout % layouts.length];
  currentLayout = Math.floor(Math.random() * layouts.length);

  Array.from(document.querySelectorAll('.index-item')).forEach((item, i) => {
    const key = item.dataset.project;

    if (itemState[key] && itemState[key].pinned) {
      applyItemState(item, key, animate);
      return;
    }

    const [xPct, yPct, wPct] = layout[i] || randomSlot(mob);
    const sz     = Math.round((wPct / 100) * iw);
    const wrap   = item.querySelector('.index-thumb-wrap');
    const aspect = getItemAspect(item);
    const { w: wrapW, h: wrapH } = computeWrapSize(sz, aspect);

    if (animate) item.classList.add('layout-animating');
    wrap.style.width  = wrapW + 'px';
    wrap.style.height = wrapH + 'px';

    const left = Math.round(
      Math.max(
        0,
        Math.min(iw - wrapW, (xPct / 100) * iw)
      )
    );
    const topMargin = mob ? 60 : 0, botMargin = mob ? 60 : 0;
    const usableH = ih - topMargin - botMargin;
    const yRaw    = mob
      ? topMargin + ((yPct - 6) / (91 - 6)) * usableH
      : (yPct / 100) * ih;
    const top = Math.round(Math.max(topMargin, Math.min(ih - wrapH - botMargin, yRaw)));

    item.style.left = left + 'px';
    item.style.top  = top  + 'px';
    if (animate) setTimeout(() => item.classList.remove('layout-animating'), 520);

    itemState[key] = { left, top, w: wrapW, h: wrapH, pinned: false };
  });
}

function constrainItemToViewport(item) {
  const wrap = item.querySelector('.index-thumb-wrap');

  const w = parseInt(wrap.style.width)  || wrap.offsetWidth;
  const h = parseInt(wrap.style.height) || wrap.offsetHeight;
  let left = parseInt(item.style.left) || 0;
  let top  = parseInt(item.style.top) || 0;

  left = Math.max(0, Math.min(window.innerWidth  - w, left));
  top  = Math.max(0, Math.min(window.innerHeight - h, top));

  item.style.left = left + 'px';
  item.style.top  = top + 'px';

  return { left, top };
}

// ── DRAG (desktop mouse) ──
function initDrag(item) {
  const key  = item.dataset.project;
  const wrap = item.querySelector('.index-thumb-wrap');

  let dragging = false, moved = false;
  let startX, startY, origLeft, origTop;

  wrap.addEventListener('mousedown', e => {
    if (e.target.classList.contains('resize-handle') ||
        e.target.classList.contains('edge-n') ||
        e.target.classList.contains('edge-s') ||
        e.target.classList.contains('edge-e') ||
        e.target.classList.contains('edge-w') ||
        e.target.classList.contains('resize-corner')) return;
    e.preventDefault();
    dragging = true;
    moved    = false;
    startX   = e.clientX;
    startY   = e.clientY;
    origLeft = parseInt(item.style.left) || 0;
    origTop  = parseInt(item.style.top)  || 0;
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
  if (!dragging) return;

  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
  if (!moved) return;

  item.style.left = (origLeft + dx) + 'px';
  item.style.top  = (origTop + dy) + 'px';

  constrainItemToViewport(item);
});

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    if (moved) {
      bringToFront(item);
      const s = itemState[key] || {};
      itemState[key] = {
        left:   parseInt(item.style.left),
        top:    parseInt(item.style.top),
        w: s.w || parseInt(wrap.style.width)  || 200,
        h: s.h || parseInt(wrap.style.height) || 200,
        pinned: true,
      };
    } else {
      item.style.zIndex = '';
    }
  });

  // Suppress click if we dragged
  wrap.addEventListener('click', e => {
    if (moved) e.stopImmediatePropagation();
  }, true);
}

// ── RESIZE (desktop mouse, corner handle + edges) ──
function initResize(item) {
  const key    = item.dataset.project;
  const wrap   = item.querySelector('.index-thumb-wrap');
  const handle = wrap.querySelector('.resize-handle');
  const edgeN  = wrap.querySelector('.edge-n');
  const edgeS  = wrap.querySelector('.edge-s');
  const edgeE  = wrap.querySelector('.edge-e');
  const edgeW  = wrap.querySelector('.edge-w');
  const MIN_SIZE = 60;

  function updateHandleAndEdges() {
    const w = parseInt(wrap.style.width)  || wrap.offsetWidth  || 200;
    const h = parseInt(wrap.style.height) || wrap.offsetHeight || 200;
    const EW = 10;

    handle.style.left   = w + 'px';
    handle.style.top    = h + 'px';
    handle.style.bottom = 'auto';
    handle.style.right  = 'auto';

    edgeN.style.cssText = `top:0px; left:0px; width:${w}px; height:${EW}px; position:absolute;`;
    edgeS.style.cssText = `top:${h - EW}px; left:0px; width:${w}px; height:${EW}px; position:absolute;`;
    edgeE.style.cssText = `top:0px; left:${w - EW}px; width:${EW}px; height:${h}px; position:absolute;`;
    edgeW.style.cssText = `top:0px; left:0px; width:${EW}px; height:${h}px; position:absolute;`;

    cornerNW.style.left = '-10px';        cornerNW.style.top = '-10px';
    cornerNE.style.left = (w - 10) + 'px'; cornerNE.style.top = '-10px';
    cornerSW.style.left = '-10px';        cornerSW.style.top = (h - 10) + 'px';
  }

  // Extra corner handles: nw, ne, sw (se = the dot handle)
  const cornerNW = document.createElement('div');
  const cornerNE = document.createElement('div');
  const cornerSW = document.createElement('div');
  [cornerNW, cornerNE, cornerSW].forEach(c => {
    c.classList.add('resize-corner');
    c.style.cssText = 'position:absolute;width:20px;height:20px;z-index:11;opacity:0;';
    wrap.appendChild(c);
  });

  const img = wrap.querySelector('img');
  img.addEventListener('load', updateHandleAndEdges);
  if (img.complete && img.naturalWidth) updateHandleAndEdges();
  new ResizeObserver(updateHandleAndEdges).observe(wrap);

  let resizing = false, resizeDidFire = false;
  let startX, startY, origW, origH, origLeft, origTop, resizeAxis, aspect;

  wrap.addEventListener('click', e => {
    if (resizeDidFire) { e.stopImmediatePropagation(); resizeDidFire = false; }
  }, true);

  function startResize(e, axis) {
    e.preventDefault();
    e.stopPropagation();
    resizing      = true;
    resizeDidFire = true;
    resizeAxis    = axis;
    startX    = e.clientX; startY = e.clientY;
    origW  = parseInt(wrap.style.width)  || wrap.offsetWidth  || 200;
    origH  = parseInt(wrap.style.height) || wrap.offsetHeight || 200;
    aspect = origW / origH;
    origLeft  = parseInt(item.style.left) || 0;
    origTop   = parseInt(item.style.top)  || 0;
    bringToFront(item);
    document.body.style.userSelect = 'none';
  }

  handle.addEventListener('mousedown',   e => startResize(e, 'se'));
  cornerNW.addEventListener('mousedown', e => startResize(e, 'nw'));
  cornerNE.addEventListener('mousedown', e => startResize(e, 'ne'));
  cornerSW.addEventListener('mousedown', e => startResize(e, 'sw'));
  edgeN.addEventListener('mousedown',    e => startResize(e, 'n'));
  edgeS.addEventListener('mousedown',    e => startResize(e, 's'));
  edgeE.addEventListener('mousedown',    e => startResize(e, 'e'));
  edgeW.addEventListener('mousedown',    e => startResize(e, 'w'));

  document.addEventListener('mousemove', e => {
    if (!resizing) return;
    const MAX_SIZE = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    let delta;
    if      (resizeAxis === 'n')  delta = -dy;
    else if (resizeAxis === 's')  delta =  dy;
    else if (resizeAxis === 'e')  delta =  dx;
    else if (resizeAxis === 'w')  delta = -dx;
    else if (resizeAxis === 'nw') delta = (-dx + -dy) / 2;
    else if (resizeAxis === 'ne') delta = ( dx + -dy) / 2;
    else if (resizeAxis === 'sw') delta = (-dx +  dy) / 2;
    else                          delta = ( dx +  dy) / 2; // se

    let newW = Math.max(MIN_SIZE, Math.min(MAX_SIZE, origW + delta));
    let newH = newW / aspect;

    wrap.style.width  = newW + 'px';
    wrap.style.height = newH + 'px';

    if (resizeAxis === 'n' || resizeAxis === 'nw' || resizeAxis === 'ne')
      item.style.top  = (origTop  + origH - newH) + 'px';
    if (resizeAxis === 'w' || resizeAxis === 'nw' || resizeAxis === 'sw')
      item.style.left = (origLeft + origW - newW) + 'px';

    constrainItemToViewport(item);
    updateHandleAndEdges();
  });

  document.addEventListener('mouseup', () => {
    if (!resizing) return;
    resizing = false;
    document.body.style.userSelect = '';
    const s = itemState[key] || {};
    itemState[key] = {
      left:   parseInt(item.style.left) || s.left || 0,
      top:    parseInt(item.style.top)  || s.top  || 0,
      w: parseInt(wrap.style.width),
      h: parseInt(wrap.style.height),
      pinned: true,
    };
  });
}

// ── MOBILE TOUCH (drag + pinch-to-resize) ──
function initMobileTouch(item) {
  const key  = item.dataset.project;
  const wrap = item.querySelector('.index-thumb-wrap');
  const MIN_SIZE = 60;

  let mode = null, dragId = null;
  let dragStartX, dragStartY, dragOrigLeft, dragOrigTop;
  let dragMoved = false, itemWasMoved = false;
  let pinchStartDist = 0, pinchOrigW = 0, pinchOrigH = 0;

  function touchDist(t1, t2) {
    const dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function touchMid(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  wrap.addEventListener('touchstart', e => {
    if (e.touches.length === 1 && mode === null) {
      mode        = 'drag';
      dragMoved   = false;
      const t     = e.touches[0];
      dragId      = t.identifier;
      dragStartX  = t.clientX;
      dragStartY  = t.clientY;
      dragOrigLeft = parseInt(item.style.left) || 0;
      dragOrigTop  = parseInt(item.style.top)  || 0;
    } else if (e.touches.length === 2) {
      mode           = 'pinch';
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchOrigW = parseInt(wrap.style.width)  || 200;
      pinchOrigH = parseInt(wrap.style.height) || 200;
    }
  }, { passive: true });

  wrap.addEventListener('touchmove', e => {
    if (mode === 'drag' || mode === 'pinch') e.preventDefault();

    if (mode === 'drag' && e.touches.length === 1) {
      const t = Array.from(e.touches).find(x => x.identifier === dragId);
      if (!t) return;
      const dx = t.clientX - dragStartX;
      const dy = t.clientY - dragStartY;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
        dragMoved = true; itemWasMoved = true; bringToFront(item);
      }
      if (!dragMoved) return;
      item.style.left = (dragOrigLeft + dx) + 'px';
      item.style.top  = (dragOrigTop + dy) + 'px';

      constrainItemToViewport(item);
    } else if (mode === 'pinch' && e.touches.length >= 2) {
      const d      = touchDist(e.touches[0], e.touches[1]);
      const scale  = d / pinchStartDist;
      const aspect = pinchOrigW / pinchOrigH;
      const maxW   = window.innerWidth * 0.9;
      let newW = Math.max(MIN_SIZE, Math.min(maxW, pinchOrigW * scale));
      let newH = newW / aspect;
      wrap.style.width  = newW + 'px';
      wrap.style.height = newH + 'px';
      itemWasMoved = true;
      bringToFront(item);
      const mid = touchMid(e.touches[0], e.touches[1]);
      item.style.left = (mid.x - newW / 2) + 'px';
      item.style.top  = (mid.y - newH / 2) + 'px';
    }
  }, { passive: false });

  wrap.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
      const wasTap = !dragMoved && !itemWasMoved;
      const s = itemState[key] || {};
      itemState[key] = {
        left:   parseInt(item.style.left),
        top:    parseInt(item.style.top),
        w: parseInt(wrap.style.width)  || s.w || 200,
        h: parseInt(wrap.style.height) || s.h || 200,
        pinned: !wasTap,
      };
      mode = null; dragId = null; dragMoved = false; itemWasMoved = false;

      if (wasTap) {
        // Prevent any stray click events from also firing
        suppressNextClick = true;
        setTimeout(() => { suppressNextClick = false; }, 400);
        handleItemActivate(key, item);
      }
    } else if (e.touches.length === 1 && mode === 'pinch') {
      // Transition from pinch back to single-finger drag
      mode        = 'drag';
      const t     = e.touches[0];
      dragId      = t.identifier;
      dragStartX  = t.clientX;
      dragStartY  = t.clientY;
      dragOrigLeft = parseInt(item.style.left) || 0;
      dragOrigTop  = parseInt(item.style.top)  || 0;
    }
  }, { passive: true });
}

// ── ITEM ACTIVATION (shared tap/click logic) ──
function handleItemActivate(key, item) {
  const p = projects[key];
  if (!p) return;
  if (activeKey === key) { closeGallery(); return; }
  if (p.gallery) {
    activeKey = key;
    stopAllSlideshows();
    openGallery(key);
  } else if (p.link) {
    const overlay = item.querySelector('.external-overlay');
    if (overlay && overlay.classList.contains('visible')) {
      // second tap — follow the link
      window.open(p.link, '_blank', 'noopener');
      overlay.classList.remove('visible');
    } else if (overlay) {
      // first tap — reveal the overlay
      overlay.classList.add('visible');
      // hide it again if they don't confirm within a few seconds
      clearTimeout(overlay._hideTimer);
      overlay._hideTimer = setTimeout(() => overlay.classList.remove('visible'), 3000);
    }
  }
}

// ── INIT ──
window.addEventListener('load', async () => {
  await fetchProjects();
  buildIndexItems();
  randomLayout(false);

  document.querySelectorAll('.index-item').forEach(item => {
    if (!('ontouchstart' in window)) {
      initDrag(item);
    }
    initResize(item);
    initMobileTouch(item);

    const key  = item.dataset.project;
    const wrap = item.querySelector('.index-thumb-wrap');
    if (projects[key] && projects[key].link) {
      const overlay = document.createElement('div');
      overlay.className = 'external-overlay';
      overlay.innerHTML = `<img src="/images/link.png" alt=""><span>links to external site</span>`;
      wrap.appendChild(overlay);
    }

    // desktop click
    wrap.addEventListener('click', () => {
      if (suppressNextClick) return;
      handleItemActivate(key, item);
    });
  });

  await Promise.all([fetchGalleryImages(), fetchWdysImages()]);

  const imgs = Array.from(document.querySelectorAll('.index-thumb-wrap img'));
  let loaded = 0, relaidOut = false;
  function finish() {
    if (relaidOut) return;
    relaidOut = true;
    randomLayout(true);
    startAllSlideshows();
    document.querySelectorAll('.index-item').forEach(el => el.style.opacity = '1');
    openFromHash();
  }
  function checkDone() {
    loaded++;
    if (loaded >= imgs.length) finish();
  }
  if (!imgs.length) finish();
  imgs.forEach(img => {
    if (img.complete && img.naturalHeight > 0) checkDone();
    else if (!img.src || img.src === window.location.href) checkDone(); // no src set
    else {
      img.addEventListener('load',  checkDone);
      img.addEventListener('error', checkDone);
    }
  });
});

window.addEventListener('resize', () => { closeGalleryUI(); randomLayout(false); });


// ── SLIDESHOWS ──
function startAllSlideshows() {
  document.querySelectorAll('.index-item').forEach(item => {
    const key = item.dataset.project;
    const p   = projects[key];
    if (!p || !p.images || p.images.length < 2 || item._indexInterval) return;
    let idx = 0;
    const speed    = 1000 + Math.random() * 3000;
    const thumbImg = item.querySelector('.index-thumb-wrap img');
    item._indexInterval = setInterval(() => {
      idx = (idx + 1) % p.images.length;
      thumbImg.src = p.images[idx].url;
    }, speed);
  });
}

function stopAllSlideshows() {
  document.querySelectorAll('.index-item').forEach(item => {
    if (item._indexInterval) { clearInterval(item._indexInterval); item._indexInterval = null; }
  });
}

// ── SITE NAME ──
siteName.addEventListener('mouseenter', () => {
  if (activeKey) siteName.classList.add('active');
});
siteName.addEventListener('mouseleave', () => {
  siteName.classList.remove('active');
});
siteName.addEventListener('click', e => {
  e.stopPropagation();
  if (activeKey) {
    closeGallery();
  } else {
    Object.keys(itemState).forEach(k => { if (itemState[k]) itemState[k].pinned = false; });
    randomLayout(true);
  }
});

// ── LINKS TOGGLE ──
let linksOpen = false;
linksBox.addEventListener('mouseenter', () => { if (!isMob()) linksList.classList.add('visible'); });
linksBox.addEventListener('mouseleave', () => { if (!isMob() && !linksOpen) linksList.classList.remove('visible'); });
linksToggle.addEventListener('click', e => {
  e.stopPropagation();
  linksOpen = !linksOpen;
  linksToggle.classList.toggle('active', linksOpen);
  linksList.classList.toggle('visible', linksOpen);
});
document.addEventListener('click', e => {
  if (linksOpen && !linksBox.contains(e.target)) {
    linksOpen = false;
    linksList.classList.remove('visible');
    linksToggle.classList.remove('active');
  }
});

// ── NOTIFY TOGGLE ──
let notifyOpen = false;

notifyBox.addEventListener('mouseenter', () => { if (!isMob()) notifyBox.classList.add('open'); });
notifyBox.addEventListener('mouseleave', () => { if (!isMob() && !notifyOpen) notifyBox.classList.remove('open'); });

notifyIcon.addEventListener('click', e => {
  e.stopPropagation();
  notifyOpen = !notifyOpen;
  notifyBox.classList.toggle('open', notifyOpen);
  if (!notifyOpen) {
    clearTimeout(subscribeCollapseTimer);
    setTimeout(resetSubscribeForm, 50);
  }
});

subscribeForm.addEventListener('transitionend', e => {
  if (e.propertyName === 'max-width' && notifyBox.classList.contains('open')) {
    document.getElementById('subscribe-email').focus();
  }
});

document.addEventListener('click', e => {
  if (notifyOpen && !notifyBox.contains(e.target)) {
    notifyOpen = false;
    notifyBox.classList.remove('open');
    clearTimeout(subscribeCollapseTimer);
    setTimeout(resetSubscribeForm, 50);
  }
});

// ── GALLERY UI (no history manipulation) ──
function openGalleryUI(key) {
  const p = projects[key];
  if (!p || !p.images) return;

  const isMemes = key === 'memes';
  galleryGrid.classList.toggle('memes', isMemes);
  galleryGrid.innerHTML = '';
  galleryGrid.style.transition = 'none';
  galleryGrid.style.opacity = isMemes ? '0' : '';

  const memeImgs = [];
  galleryGrid.classList.toggle('entries', p.layout === 'entries');
  if (p.layout === 'entries') buildEntriesGrid(p);

  (p.layout === 'entries' ? [] : p.images).forEach((imgData, i) => {
    if (imgData.url.endsWith('.pdf')) {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'width:100%;position:relative;';
      const embed = document.createElement('embed');
      embed.src       = imgData.url + '#toolbar=0&navpanes=0&scrollbar=0';
      embed.type      = 'application/pdf';
      embed.style.cssText = 'width:100%;height:80vh;display:block;border:none;';
      wrap.appendChild(embed);
      galleryGrid.appendChild(wrap);
    } else {
      const img       = document.createElement('img');
      img.src         = imgData.url;
      img.loading     = isMemes ? 'eager' : 'lazy';
      img.dataset.index = i;
      galleryGrid.appendChild(img);
      if (isMemes) memeImgs.push(img);
    }
  });

  if (isMemes) {
    const total = memeImgs.length;
    if (total === 0) {
      galleryGrid.style.transition = 'opacity 0.25s ease';
      galleryGrid.style.opacity = '1';
    } else {
      let loaded = 0;
      const done = () => {
        loaded++;
        if (loaded >= total) {
          galleryGrid.style.transition = 'opacity 0.25s ease';
          galleryGrid.style.opacity = '1';
        }
      };
      memeImgs.forEach(img => {
        if (img.complete) done();
        else {
          img.addEventListener('load', done);
          img.addEventListener('error', done);
        }
      });
    }
  }

  const cols = p.columns || 3;
  galleryGrid.style.gridTemplateColumns = isMemes ? '' : `repeat(${cols}, 1fr)`;

  galleryCloseBtn.style.display = 'block';
  notifyBox.style.display = 'none';
  document.body.classList.toggle('zines-open', key === 'zines');

  const titleEl = isMob() ? mobPanelTitle : deskPanelTitle;
  titleEl.innerHTML = p.link
    ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>`
    : esc(p.title);
    mobPanelTitle.style.transform = '';
    mobPanelTitle.style.transition = '';
  titleEl.classList.add('visible');

  galleryOverlay.style.width      = '100%';
  galleryOverlay.style.transition = 'none';
  galleryOverlay.style.transform  = 'translateX(-100%)';
  galleryOverlay.style.display    = 'block';

  requestAnimationFrame(() => {
    galleryOverlay.style.transition = 'transform 0.45s cubic-bezier(0.4,0,0.2,1)';
    galleryOverlay.style.transform  = 'translateX(0)';
  });

  setTimeout(() => { galleryOverlay.scrollTop = 0; }, 50);
}

function closeGalleryUI() {
  if (closeGalleryTimer) { clearTimeout(closeGalleryTimer); closeGalleryTimer = null; }
  activeKey = null;
  galleryCloseBtn.style.display = 'none';
  notifyBox.style.display = '';
  document.body.classList.remove('zines-open');

 requestAnimationFrame(() => {
  mobPanelTitle.classList.remove('visible');
  deskPanelTitle.classList.remove('visible');
  galleryOverlay.style.transition = 'transform 0.45s cubic-bezier(0.4,0,0.2,1)';
  galleryOverlay.style.transform  = 'translateX(-100%)';
  });

  closeGalleryTimer = setTimeout(() => {
    galleryOverlay.style.display    = 'none';
    galleryOverlay.style.transform  = '';
    galleryOverlay.style.transition = '';
    galleryGrid.innerHTML           = '';
    mobPanelTitle.innerHTML         = '';
    deskPanelTitle.innerHTML        = '';
    startAllSlideshows();

  }, 450);
}

// ── GALLERY (with history) ──
function openGallery(key) {
  openGalleryUI(key);
  history.pushState({ view: 'gallery', key }, '', `#${key}`);
}

function closeGallery() {
  if (poppingState) { closeGalleryUI(); return; }
  history.back();
}

galleryCloseBtn.addEventListener('click', e => { e.stopPropagation(); closeGallery(); });

// ── OPEN FROM URL HASH (deep linking) ──
function openFromHash() {
  const hash = window.location.hash.slice(1); // e.g. "memes" or "memes/3"
  if (!hash) return;
  const [key, idxStr] = hash.split('/');
  const p = projects[key];
  if (!p || !p.gallery || !p.images) return;

  activeKey = key;
  stopAllSlideshows();
  openGalleryUI(key);

  if (idxStr !== undefined && !isNaN(parseInt(idxStr, 10))) {
    const n = parseInt(idxStr, 10);
    if (p.layout === 'entries') {
      if (p.entries && p.entries[n]) {
        activeEntry = p.entries[n];
        activeEntryIndex = n;
        showLightboxUI(0);
      }
    } else {
      showLightboxUI(n);
    }
  }

  // Sync history state without adding a duplicate entry
  const state = idxStr !== undefined
    ? { view: 'lightbox', key, index: lightboxIndex }
    : { view: 'gallery', key };
  history.replaceState(state, '', window.location.hash);
}

// ── GALLERY SWIPE-TO-CLOSE (mobile) ──
function initGallerySwipe() {
  let startX, startY, currentX, dragging = false, axisLocked = null;

  galleryOverlay.addEventListener('touchstart', e => {
    if (!activeKey || lightbox.classList.contains('visible')) return;
    startX = currentX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging   = true;
    axisLocked = null;
    galleryOverlay.style.transition = 'none';
    mobPanelTitle.style.transition = 'none';
  }, { passive: true });

  galleryOverlay.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (axisLocked === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
      axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (axisLocked === 'y') return;
    e.preventDefault();
    currentX = e.touches[0].clientX;
    if (dx > 0) return; // only drag left
    galleryOverlay.style.transform = `translateX(${dx}px)`;
    mobPanelTitle.style.transform = `translateX(${dx}px)`;
  }, { passive: false });

  galleryOverlay.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    if (axisLocked === 'y') return;
    const dx        = currentX - startX;
    const threshold = window.innerWidth * 0.25;
    galleryOverlay.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
    if (Math.abs(dx) > threshold) {
      galleryOverlay.style.transform = 'translateX(-100%)';
      mobPanelTitle.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
      mobPanelTitle.style.transform  = 'translateX(-100vw)';
      setTimeout(() => history.back(), 350);
    } else {
      galleryOverlay.style.transform = 'translateX(0)';
      mobPanelTitle.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
      mobPanelTitle.style.transform  = 'translateX(0)';
    }
  });
}
initGallerySwipe();

// ── LIGHTBOX META ──
const MONTH_NAMES = ['january','february','march','april','may','june','july','august','september','october','november','december'];

function formatMeta(imgData, key) {
  const lines = [];
  if (key === 'selfies' || key === 'unsubscribe' || key === 'headphones' || key === 'memes' || key === 'trees') {
    if (imgData.taken_at) {
      const d = new Date(imgData.taken_at);
      lines.push(`${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`);
    }
  if (key === 'headphones' && imgData.lat != null && imgData.lng != null) {
      lines.push(`(${parseFloat(imgData.lat).toFixed(4)}, ${parseFloat(imgData.lng).toFixed(4)})`);
    }
  } else if (key === 'zines') {
    if (imgData.question_1) lines.push(imgData.question_1);
    if (imgData.question_2) lines.push(imgData.question_2);
    if (imgData.scanned)    lines.push(imgData.scanned);
  } else if (key === 'essences') {
    if (imgData.type) lines.push(imgData.type);
    if (imgData.use) lines.push(imgData.use);
    if (imgData.contents) lines.push(imgData.contents);
  } else if (key === 'cables') {
    const parts = [];
    if (imgData.cable) parts.push(imgData.cable);
    if (imgData.plant) parts.push(`cut out of ${imgData.plant}`);
    if (imgData.taken_at) {
      const d = new Date(imgData.taken_at);
      parts.push(`in ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`);
    }
    if (parts.length) lines.push(parts.join(' '));
  } else if (key === 'bioephemera') {
    const parts = [];
    if (imgData.plant) parts.push(imgData.plant);
    if (imgData.location) parts.push(`from ${imgData.location}`);
    if (imgData.book) {
      const bookHTML = imgData.book_link
        ? `<a href="${imgData.book_link}" target="_blank" rel="noopener"><em>${imgData.book}</em></a>`
        : `<em>${imgData.book}</em>`;
      parts.push(`stashed in ${bookHTML}`);
    }
    if (imgData.scanned) parts.push(`in ${imgData.scanned}`);
    if (parts.length) lines.push(parts.join(' '));
  } else {
    // projects added from the admin page: caption, plus date if turned on
    if (imgData.caption) lines.push(renderCaption(imgData.caption));
    if (projects[key] && projects[key].show_date && imgData.taken_at) {
      const d = new Date(imgData.taken_at);
      lines.push(`${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`);
    }
  }
  return lines.join('<br>');
}

// ── LIGHTBOX UI (no history manipulation) ──
function showLightboxUI(index) {
  const p = projects[activeKey];
  if (!p) return;
  lightboxImages = activeEntry ? activeEntry.images : p.images;
  if (!lightboxImages || !lightboxImages.length) return;
  lightboxIndex  = ((index % lightboxImages.length) + lightboxImages.length) % lightboxImages.length;
  const imgData  = lightboxImages[lightboxIndex];
  lightboxImg.src        = imgData.url;
  lightboxMeta.innerHTML = activeEntry ? formatEntryMeta(activeEntry, p) : formatMeta(imgData, activeKey);
  lightbox.classList.toggle('entry-mode', !!activeEntry);
  lightbox.classList.add('visible');
  mobileZoomScale    = 1;
  mobileZoomLastDist = null;
  lightboxImg.style.transform = '';
}

function closeLightboxUI() {
  lightbox.classList.remove('visible', 'entry-mode');
  activeEntry = null;
  activeEntryIndex = null;
  lightboxImg.src        = '';
  lightboxMeta.textContent = '';
  lightboxImages     = [];
  mobileZoomScale    = 1;
  mobileZoomLastDist = null;
}

// ── LIGHTBOX (with history) ──
function showLightbox(index) {
  showLightboxUI(index);
  if (!poppingState) {
    history.pushState({ view: 'lightbox', key: activeKey, index: lightboxIndex }, '', `#${activeKey}/${lightboxIndex}`);
  }
}

function closeLightbox() {
  if (poppingState) { closeLightboxUI(); return; }
  history.back();
}

function navigateLightbox(index) {
  showLightboxUI(index);
  const n = activeEntry ? activeEntryIndex : lightboxIndex;   // tools: the address points at the tool
  history.replaceState({ view: 'lightbox', key: activeKey, index: n }, '', `#${activeKey}/${n}`);
}

galleryGrid.addEventListener('click', e => {
  const tile = e.target.closest('.entry-tile');
  if (tile) {
    e.stopPropagation();
    openEntry(parseInt(tile.dataset.entry, 10));
    return;
  }
  const img = e.target.closest('#gallery-grid img');
  if (!img) return;
  e.stopPropagation();
  showLightbox(parseInt(img.dataset.index, 10));
});

lightboxClose.addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });
lightboxPrev.addEventListener('click',  e => { e.stopPropagation(); navigateLightbox(lightboxIndex - 1); });
lightboxNext.addEventListener('click',  e => { e.stopPropagation(); navigateLightbox(lightboxIndex + 1); });
lightbox.addEventListener('click',      e => { if (e.target === lightbox) closeLightbox(); });

// ── LIGHTBOX SWIPE + PINCH-TO-ZOOM (mobile) ──
let touchStartX = null;

lightbox.addEventListener('touchstart', e => {
  if (e.touches.length === 2) return; // let pinch handle it
  touchStartX = e.touches[0].clientX;
}, { passive: true });

lightbox.addEventListener('touchend', e => {
  if (mobileZoomScale > 1) return; // disable swipe when zoomed
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  touchStartX = null;
  if (Math.abs(dx) < 40) return;
  if (dx < 0) navigateLightbox(lightboxIndex + 1);
  else        navigateLightbox(lightboxIndex - 1);
}, { passive: true });

lightbox.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const [a, b] = e.touches;
  const dist   = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if (mobileZoomLastDist) {
    mobileZoomScale = Math.min(4, Math.max(1, mobileZoomScale * (dist / mobileZoomLastDist)));
    lightboxImg.style.transform = `scale(${mobileZoomScale})`;
  }
  mobileZoomLastDist = dist;
}, { passive: false });

// ── HISTORY ──
window.addEventListener('popstate', () => {
  poppingState = true;
  if (lightbox.classList.contains('visible')) {
    closeLightboxUI();
  } else if (activeKey) {
    closeGalleryUI();
  }
  poppingState = false;
});

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (lightbox.classList.contains('visible')) {
    if (e.key === 'ArrowLeft')  navigateLightbox(lightboxIndex - 1);
    if (e.key === 'ArrowRight') navigateLightbox(lightboxIndex + 1);
    if (e.key === 'Escape')     closeLightbox();
  } else if (activeKey) {
    if (e.key === 'Escape') closeGallery();
  }
});

// ── TRACKPAD HORIZONTAL SWIPE TO CLOSE ──
let wheelGestureLock = false;
window.addEventListener('wheel', e => {
  if (wheelGestureLock) return;
  if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return; // vertical scroll — ignore
  if (!activeKey && !lightbox.classList.contains('visible')) return;
  if (e.deltaX > 80) {
    wheelGestureLock = true;
    history.back();
    setTimeout(() => { wheelGestureLock = false; }, 500);
  }
}, { passive: true });

// ── SUBSCRIBE FORM ──
let subscribeCollapseTimer = null;

document.getElementById('subscribe-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const emailInput = document.getElementById('subscribe-email');
  const msg = document.getElementById('subscribe-msg');
  const email = emailInput.value.trim();

  emailInput.style.display = 'none';
  msg.classList.add('success'); // just means "inline position" now

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/subscribers`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ email })
    });

    if (res.ok) {
      msg.textContent = "thanks :)";
    } else if (res.status === 409) {
      msg.textContent = 'already subscribed';
    } else {
      msg.textContent = 'something went wrong';
    }
  } catch (err) {
    msg.textContent = 'something went wrong';
  }

  scheduleSubscribeCollapse();
});

function scheduleSubscribeCollapse() {
  const msg = document.getElementById('subscribe-msg');
  subscribeCollapseTimer = setTimeout(() => {
    msg.classList.add('collapsing');
    setTimeout(() => {
      notifyOpen = false;
      notifyBox.classList.remove('open');
      setTimeout(resetSubscribeForm, 350);
    }, 400);
  }, 2200);
}

function resetSubscribeForm() {
  const emailInput = document.getElementById('subscribe-email');
  const msg = document.getElementById('subscribe-msg');
  emailInput.style.display = '';
  emailInput.value = '';
  msg.classList.remove('success', 'collapsing');
  msg.textContent = '';
}
